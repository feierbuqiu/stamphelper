name: Publish GitHub Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Signed release tag to publish
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-package-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish source package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Check out signed release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js and GitHub Packages
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@feierbuqiu'

      - name: Verify tag and package version
        run: node scripts/verify-release-version.mjs "$RELEASE_TAG"

      - name: Install locked dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run check

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Publish package
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
